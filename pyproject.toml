[project]
name = "what-to-do"
version = "0.1.0"
description = "A simple way to organize my tasks."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
]
[project.scripts]
what-to-do = "what_to_do.cli.entrypoint:main"

[build-system]
requires = ["uv_build>=0.10.0, <0.11.0"]
build-backend = "uv_build"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__init__.py"]


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:", 
    "pass", 
    "@abstractmethod",
    "app()",
]